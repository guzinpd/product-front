<!-- src/app/features/products/list/list.component.html -->
<mat-card class="table-card">
    <mat-card-header>
        <mat-card-title>Produtos</mat-card-title>
    </mat-card-header>

    <!-- filtros fora da tabela -->
    <div class="filter-row">
        <mat-form-field appearance="outline">
            <mat-label>Nome</mat-label>
            <input #fName matInput (keyup)="applyColumnFilter('name', fName.value)" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Descrição</mat-label>
            <input #fDesc matInput (keyup)="applyColumnFilter('description', fDesc.value)" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Preço (R$)</mat-label>
            <input #fPrice matInput type="number" (keyup)="applyColumnFilter('price', fPrice.value)" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Categoria</mat-label>
            <input #fCat matInput (keyup)="applyColumnFilter('category', fCat.value)" />
        </mat-form-field>

        <mat-checkbox class="filter-checkbox" (change)="applyColumnFilter('available', $event.checked ? 'true' : '')">
            Apenas disponíveis
        </mat-checkbox>
    </div>

    <!-- tabela -->
    <div class="table-container">
        <table mat-table [dataSource]="dataSource" matSort class="full-width">

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
                <td mat-cell *matCellDef="let p">{{ p.name }}</td>
            </ng-container>

            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Descrição</th>
                <td mat-cell *matCellDef="let p">{{ p.description }}</td>
            </ng-container>

            <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Preço (R$)</th>
                <td mat-cell *matCellDef="let p">{{ p.price | currency:'BRL' }}</td>
            </ng-container>

            <ng-container matColumnDef="available">
                <th mat-header-cell *matHeaderCellDef>Disponível</th>
                <td mat-cell *matCellDef="let p">{{ p.available ? 'Sim' : 'Não' }}</td>
            </ng-container>

            <ng-container matColumnDef="category">
                <th mat-header-cell *matHeaderCellDef>Categoria</th>
                <td mat-cell *matCellDef="let p">{{ p.categoryPath.name }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Ações</th>
                <td mat-cell *matCellDef="let p">
                    <button mat-icon-button color="primary" (click)="openEdit(p)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="onDelete(p.id)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [length]="dataSource.data.length" [pageSize]="5" [pageSizeOptions]="[5]" showFirstLastButtons>
        </mat-paginator>
    </div>
</mat-card>

<div class="actions" style="text-align: right; margin-top: 16px;">
    <button mat-flat-button color="primary" (click)="openCreate()" class="btn-create">
        <mat-icon>add</mat-icon>
        Adicionar Produto
    </button>
</div>
